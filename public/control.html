<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bomb game: control</title>
  <link rel="stylesheet" href="/app/style.css">
</head>
<body class="controlbody">
  <div id="start" class="joinpage">
    <h1>Control panel</h1>
    <form id="controlform" autocomplete="off">
      <label for="code">Room code</label>
      <input id="code" name="code" type="text" maxlength="4" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="ABCD" required>
      <label for="passcode">Host passcode</label>
      <input id="passcode" name="passcode" type="password" autocomplete="current-password" required>
      <button id="controlbtn" type="submit">Open control panel</button>
      <p id="controlerror" class="error" role="alert"></p>
    </form>
  </div>
  <div id="netstatus" class="banner" hidden></div>
  <div id="panel" class="panelpage" hidden></div>
  <script type="module" src="/app/control-page.js"></script>
</body>
</html>
