<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bomb game: try the ticking</title>
  <link rel="stylesheet" href="/app/themes.css">
  <link rel="stylesheet" href="/app/style.css">
  <style>
    /* A throwaway page (removed once Roy has picked a tick). Colours come from the theme only. */
    .soundpage { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }
    .soundpage h1 { font-size: 44px; margin: 16px 0 8px; color: var(--spark); }
    .soundpage .lead { color: var(--muted); margin: 0 0 24px; }
    .style { background: var(--panel); border-radius: 14px; padding: 14px 18px 18px; margin: 0 0 14px; }
    .style h2 { font-size: 26px; margin: 0 0 4px; }
    .style p { margin: 0 0 12px; color: var(--muted); font-size: 17px; }
    .style .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
    .style button, .stop button { margin: 0; width: auto; flex: 1 1 180px; font-size: 22px; padding: 10px 14px; }
    .style button[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--spark), inset 0 -5px 0 var(--tile-edge); }
    .stop { display: flex; gap: 12px; align-items: center; margin: 0 0 20px; flex-wrap: wrap; }
    .stop button { flex: 0 0 auto; }
    #status { color: var(--names); font-weight: 600; }
  </style>
</head>
<body>
  <main class="soundpage">
    <h1>Try the ticking</h1>
    <p class="lead">Pick the tick that sounds best on the classroom speakers. <strong>Calm</strong> is the start of a turn (one tick a second), <strong>Urgent</strong> is the last 3 seconds (four a second), and <strong>With explosion</strong> is a 10-second turn that ends with the bang.</p>
    <div class="stop">
      <button type="button" id="stop">Stop</button>
      <span id="status" role="status" aria-live="polite">Click a button to listen.</span>
    </div>
    <div id="styles"></div>
  </main>
  <script type="module" src="/sound-test/sound-test.js"></script>
</body>
</html>
