<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bomb game</title>
  <link rel="stylesheet" href="/app/style.css">
</head>
<body>
  <div id="join" class="joinpage">
    <h1>Bomb game</h1>
    <form id="joinform" autocomplete="off">
      <label for="code">Room code</label>
      <input id="code" name="code" type="text" maxlength="4" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="ABCD" required>
      <label for="nick">Your nickname</label>
      <input id="nick" name="nick" type="text" maxlength="16" autocomplete="off" spellcheck="false" placeholder="Nickname" required>
      <button id="joinbtn" type="submit">Join</button>
      <p id="joinerror" class="error" role="alert"></p>
    </form>
  </div>
  <div id="game" class="gamepage" hidden></div>
  <script type="module" src="/app/player-page.js"></script>
</body>
</html>
